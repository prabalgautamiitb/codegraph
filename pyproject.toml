[project]
name = "codegraph"
version = "0.1.0"
description = "Local-first codebase knowledge graph explorer"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "pydantic==2.10.4",
  "sqlalchemy==2.0.36",
  "alembic==1.14.0",
  "uvicorn[standard]==0.34.0",
  "tree-sitter==0.24.0",
  "tree-sitter-python==0.23.6",
  "tree-sitter-java==0.23.5",
  "networkx==3.4.2",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
]

[project.scripts]
codegraph-analyze = "backend.app.ingestion.cli:main"
codegraph-worker = "backend.app.jobs.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
